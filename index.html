<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8a4fd1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family Care">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Family Cycle Support</title>
<style>
:root{--bg:#f6f2f7;--card:#fff;--tx:#241d2b;--mu:#7b7285;--ac:#8a4fd1;--bd:#ece6f0;--sh:0 4px 18px rgba(60,30,90,.07);--c1:#d7263d;--c2:#2fa58b;--c3:#e08a1e;--c4:#8d7be8;--c5:#4b2a9f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16121b;--card:#211b29;--tx:#f4eef8;--mu:#a99db5;--ac:#b98af0;--bd:#31283c;--sh:none}}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 14px 100px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
h1{font-size:19px;margin:0}h2{font-size:16px;margin:0 0 8px}h3{font-size:13px;margin:0 0 6px;color:var(--mu)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;max-width:100%}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}button.g{border:0;background:none;color:var(--mu)}
input,textarea{width:100%}label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
.nav{position:fixed;inset-inline:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:0;font-size:11px;color:var(--mu);padding:4px 2px}.nav button span{font-size:22px}.nav .on{color:var(--ac);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px}.chip{display:flex;align-items:center;gap:8px;padding-block:5px;padding-inline:5px 14px;border-radius:999px;white-space:nowrap;background:var(--card)}
.ava{width:30px;height:30px;border-radius:50%;color:#fff;display:inline-grid;place-items:center;font-size:14px;font-weight:700;flex:none}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.hero{color:#fff;border:0;display:flex;gap:16px;align-items:center}.hero .ph{font-size:22px;font-weight:700;line-height:1.25;margin:0 0 4px}.hero .sub{font-size:14px;opacity:.92}.hero .who{font-size:13px;opacity:.85}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.pill{background:rgba(255,255,255,.2);border-radius:999px;padding:3px 10px;font-size:12px}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}.duo .card{margin:0}.duo p{margin:0}
.empty{text-align:center;padding:30px 16px}.empty p{margin:8px 0 14px}
.mu{color:var(--mu);font-size:14px}ul{margin:6px 0;padding-inline-start:20px}li{margin:4px 0}
.ban{background:#fdecef;color:#7a2b43;border-radius:14px;padding:10px 14px;margin-bottom:10px;font-size:14px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .ban{background:#3b2229;color:#f3c9d6}}
.lock{max-width:340px;margin:12vh auto;text-align:center}.lock input{text-align:center;font-size:22px;letter-spacing:8px;margin:10px 0}
.err{color:var(--c1);font-size:14px;min-height:20px}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:6px 2px;border-bottom:1px solid var(--bd)}
.band{display:flex;height:26px;border-radius:13px;overflow:hidden}.band i{display:block}
.who2{font-size:13px;font-weight:600;margin:12px 0 5px}.ax{position:relative;height:24px;font-size:11px;color:var(--mu)}.ax span{position:absolute;white-space:nowrap}
.lgs{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mu);margin-top:12px}.lgd{display:flex;align-items:center;gap:5px}.lgd b{width:9px;height:9px;border-radius:50%;display:inline-block}
.win{display:flex;gap:14px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--bg);margin-top:10px;border-inline-start:6px solid}
.win .n{font-size:24px;font-weight:700;text-align:center;min-width:44px;line-height:1}.win .n small{display:block;font-size:10px;font-weight:400;color:var(--mu);margin-top:2px}.win .mu{font-size:13px}
.fr{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center;padding:10px 0}.fr+.fr{border-top:1px solid var(--bd)}.fl{font-size:13px;color:var(--mu)}
.eb{display:flex;align-items:center;gap:10px}.seg{display:flex;gap:4px;flex:1}.seg i{flex:1;height:10px;border-radius:5px}.eb b{font-size:14px;min-width:60px}
.md{display:flex;align-items:center;gap:10px;font-size:14px}.em{font-size:32px;line-height:1}
.chp{display:flex;flex-wrap:wrap;gap:6px}.cp{background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:3px 10px;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.tile{background:var(--bg);border-radius:14px;padding:12px;font-size:14px;display:flex;flex-direction:column;gap:6px}.tile span{font-size:26px;line-height:1}

.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:14px;margin:0 auto;max-width:520px;background:var(--ac);color:#fff;padding:12px 16px;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:50;text-align:center;font-weight:600}

:root{--hi:rgba(255,255,255,.85);--sh1:rgba(70,40,110,.16);--sh2:rgba(70,40,110,.08);--card2:#f3edf7}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--hi:rgba(255,255,255,.07);--sh1:rgba(0,0,0,.55);--sh2:rgba(0,0,0,.3);--card2:#1b1523}}
body{background:radial-gradient(900px 500px at 8% -8%,rgba(176,126,230,.26),transparent 60%),radial-gradient(800px 500px at 108% 8%,rgba(240,150,180,.22),transparent 60%),var(--bg);background-attachment:fixed}
main{padding-bottom:124px}
.card{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--hi);box-shadow:inset 0 1px 0 var(--hi),0 16px 30px -12px var(--sh1),0 3px 6px var(--sh2)}
button{background:linear-gradient(180deg,var(--card),var(--card2));box-shadow:inset 0 1px 0 var(--hi),0 3px 0 var(--bd),0 8px 14px -6px var(--sh1);transition:transform .12s,box-shadow .12s}
button:active{transform:translateY(2px);box-shadow:inset 0 1px 0 var(--hi),0 1px 0 var(--bd),0 2px 6px -3px var(--sh1)}
button.g{background:none;box-shadow:none}
button.p{background:linear-gradient(180deg,#a67be8,#7b43c9);border-color:#6a35b5;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 0 #55289a,0 10px 16px -8px rgba(90,40,160,.35)}
button.p:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 0 #55289a,0 3px 8px -3px rgba(90,40,160,.4)}
input,textarea{background:var(--card2);box-shadow:inset 0 2px 5px var(--sh1)}
.nav{inset-inline:12px;max-width:536px;margin-inline:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));border-radius:28px;border:1px solid var(--hi);padding:6px;background:linear-gradient(145deg,var(--card),var(--card2));box-shadow:inset 0 1px 0 var(--hi),0 20px 38px -8px var(--sh1),0 4px 10px var(--sh2)}
.nav button{background:none;box-shadow:none;border-radius:20px;transition:none}.nav button:active{transform:none}
.nav .on{background:linear-gradient(180deg,var(--ac),color-mix(in srgb,var(--ac) 68%,#000));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 8px -5px var(--ac)}
.hero{--hc:#888;position:relative;overflow:hidden;box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -12px 20px rgba(0,0,0,.16),0 16px 28px -16px color-mix(in srgb,var(--hc) 50%,transparent),0 6px 10px rgba(0,0,0,.14)}
.hero>*{position:relative}.hero::before{content:"";position:absolute;inset:0 0 50% 0;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0));pointer-events:none}
.hero svg{filter:drop-shadow(0 6px 8px rgba(0,0,0,.32))}
.chip{box-shadow:inset 0 1px 0 var(--hi),0 3px 0 var(--bd),0 8px 12px -6px var(--sh1)}
.chip.on{background:linear-gradient(180deg,#8a4fd1,#a67be8);box-shadow:inset 0 3px 6px rgba(0,0,0,.32)}
.ava,.lgd b{background-image:radial-gradient(circle at 32% 28%,rgba(255,255,255,.65),rgba(255,255,255,0) 62%)!important;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.band{box-shadow:inset 0 3px 6px rgba(0,0,0,.28),0 1px 0 var(--hi)}
.band i{background-image:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 55%,rgba(0,0,0,.14))!important}
.seg i{background-image:linear-gradient(180deg,rgba(255,255,255,.45),rgba(0,0,0,.1))!important;box-shadow:0 2px 3px rgba(0,0,0,.2)}
.tile,.win,.cp{background:linear-gradient(145deg,var(--card),var(--card2));box-shadow:inset 0 1px 0 var(--hi),0 8px 14px -8px var(--sh1)}
.tz{cursor:pointer;display:flex;gap:12px;align-items:center}.tzi{font-size:28px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cg>span{text-align:center;font-size:11px;color:var(--mu)}
.cd{position:relative;aspect-ratio:1;padding:0;border-radius:12px;font-size:14px;display:grid;place-items:center;background-color:var(--card);background-image:linear-gradient(180deg,rgba(255,255,255,.4),rgba(0,0,0,.07))!important;box-shadow:inset 0 1px 0 var(--hi),0 3px 0 var(--bd),0 6px 8px -5px var(--sh1)}
.cd u{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--tx);opacity:.75}.cd.tdy{outline:2px solid var(--tx);outline-offset:2px;font-weight:700}

.tlw{position:relative}.tlw .sep{display:block;position:absolute;top:20px;bottom:0;width:2px;transform:translateX(-50%);background:radial-gradient(circle,#fff 0,#fff 0.9px,rgba(255,255,255,0) 1.2px) 0 0/2px 6px repeat-y;-webkit-filter:drop-shadow(0 0 .6px rgba(0,0,0,.9));filter:drop-shadow(0 0 .6px rgba(0,0,0,.9));pointer-events:none;z-index:5}
.ax span{padding-inline-start:5px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--c4:#a395f2;--c5:#7a58e0}}
.priv main,.priv .nav{filter:blur(22px)}
</style>
</head>

function phAt(c,iso,td){

function dashParts(){

  const runs=m=>{const w=[];for(let i=0;i<N;){if(st[i]>=m){let j=i;while(j+1<N&&st[j+1]>=m)j++;if(j>i)w.push([i,j]);i=j+1}else i++}return w};

  const all=runs(3),most=runs(2).filter(([a,b])=>!all.some(([x,y])=>x<=b&&y>=a)),ln=(x,y)=>(y[1]-y[0])-(x[1]-x[0]);
  const win=(a,b,k)=>{const off=k===2?rows.filter(r=>r.ph.slice(a,b+1).some(z=>!ok(z))).map(r=>esc(r.n)):[];return `<div class="win" style="border-color:${OC[k]}"><div class="n">${nf(b-a+1)}<small>${t().days}</small></div><div><b>${fw(days[a])} – ${fw(days[b])}</b><div class="mu">${[0,t().mixed,t().most,t().allOk][k]}${off.length?` · ${t().lessFor} ${off.join(", ")}`:""}</div></div></div>`};
  const wl=[...all.sort(ln).slice(0,3).map(w=>[w[0],w[1],3]),...most.sort(ln).slice(0,2).map(w=>[w[0],w[1],2]),...calmR.sort(ln).slice(0,2).map(w=>[w[0],w[1],1])].sort((a,b)=>a[0]-b[0]).map(w=>win(w[0],w[1],w[2]));

  const c2=`<div class="card"><h2>🌿 ${t().best}</h2><div class="tlw">${seps}${ax}${band(st,k=>oc[k],k=>[t().caut,t().mixed,t().most,t().allOk][k])}</div><div class="lgs">${lg2}</div>${wl.length?wl.join(""):`<div class="mu" style="margin-top:10px">${t().noWin}</div>`}<div class="mu" style="margin-top:10px">${t().far}</div></div>`;
